name: update-manifests
description: data2flow-manifests의 overlays/staging 이미지 태그를 이 커밋 SHA로 바꾼다(Argo CD가 staging에 반영). 동시 갱신 충돌은 5회까지 재시도한다.
inputs:
  app-name:
    description: 이미지 이름 (예 data2flow-core-api)
    required: true
  token:
    description: data2flow-manifests 쓰기 권한 토큰(MANIFEST_REPO_TOKEN). 비어 있으면 경고만 남기고 건너뛴다
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: imranismail/setup-kustomize@v3
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        APP: ${{ inputs.app-name }}
        SHA: ${{ github.sha }}
        OWNER: ${{ github.repository_owner }}
        SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::warning::MANIFEST_REPO_TOKEN 시크릿이 없어 manifests 갱신을 건너뜁니다"; exit 0
        fi
        git clone -q "https://x-access-token:${TOKEN}@github.com/${OWNER}/data2flow-manifests.git" "$RUNNER_TEMP/m"
        cd "$RUNNER_TEMP/m"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        for i in 1 2 3 4 5; do
          (cd overlays/staging && kustomize edit set image "ghcr.io/${OWNER}/${APP}=ghcr.io/${OWNER}/${APP}:${SHA}")
          git add overlays/staging/kustomization.yaml
          git commit -q -m "chore(staging): ${APP} ${SHA::7}" -m "$SOURCE" || { echo "변경 없음"; exit 0; }
          if git push -q; then exit 0; fi
          echo "::warning::manifests push 거부(동시 갱신) — 재시도 $i/5"
          git fetch -q origin && git reset -q --hard origin/main
        done
        echo "::error::manifests 갱신 5회 실패"; exit 1
